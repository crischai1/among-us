# fly launch --no-deploy  (then: fly deploy)
# Rooms live in memory, so run exactly one machine.
app = "among-us-web"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
