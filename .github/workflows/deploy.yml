name: Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-among-us
    steps:
      - name: Deploy over ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Pasted secrets often carry a trailing newline, which breaks name resolution.
          SSH_HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # The key is pinned to labs-deploy on the server; the command is just the app name.
          # Deploy logic lives in crischai.com/infra/labs-deploy.
          ssh labs@"$SSH_HOST" among-us
